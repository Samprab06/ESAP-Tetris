[platformio]
core_dir = C:\Users\Public\.pio
default_envs = esp32doit-devkit-v1

[env:esp32doit-devkit-v1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32doit-devkit-v1
framework = arduino
lib_ldf_mode = deep
lib_deps = 
    bodmer/TFT_eSPI

build_flags =
  ; Display configuration
  -D USER_SETUP_LOADED=1
  -D ILI9341_DRIVER=1        
  -D TFT_MISO=19
  -D TFT_MOSI=23
  -D TFT_SCLK=18
  -D TFT_CS=5
  -D TFT_DC=2
  -D TFT_RST=4
  -D LOAD_GLCD=1               
  -D SPI_FREQUENCY=27000000
  -D LOAD_FONT2=1

[env:wokwi]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32doit-devkit-v1
framework = arduino
lib_ldf_mode = deep
lib_deps =
    bodmer/TFT_eSPI
lib_ignore =
    ESP_I2S
    SD
build_flags =
  -D USER_SETUP_LOADED=1
  -D ILI9341_DRIVER=1
  -D TFT_MISO=19
  -D TFT_MOSI=23
  -D TFT_SCLK=18
  -D TFT_CS=5
  -D TFT_DC=2
  -D TFT_RST=4
  -D LOAD_GLCD=1
  -D SPI_FREQUENCY=27000000
  -D LOAD_FONT2=1
  -D WOKWI_SIM=1
build_src_filter =
  +<*>
  -<audio.cpp>
  -<sdcard.cpp>