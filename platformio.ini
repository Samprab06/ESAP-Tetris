[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino

build_flags =
  ; Local library includes
  -I lib/arduino-esp32-release-v2.x
  # -I C:/.platformio/packages/framework-arduinoespressif32@src-262fa62c27b81033b57e37f6ab09cbed/cores/esp32
  ; Display configuration
  -D USER_SETUP_LOADED=1
  -D ST7796_DRIVER=1        
  -D TFT_MISO=19
  -D TFT_MOSI=23
  -D TFT_SCLK=18
  -D TFT_CS=5
  -D TFT_DC=2
  -D TFT_RST=4
  -D LOAD_GLCD=1               
  -D SPI_FREQUENCY=27000000
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1

lib_deps =
  bodmer/TFT_eSPI
  earlephilhower/ESP8266Audio @ 1.9.7
  
